name: Profile Metrics
on:
  schedule: [{ cron: "0 5 * * 1,4" }]
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: .github/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Abhi8099
          template: classic
          base: header, activities, community
          config_timezone: Asia/Kolkata
          plugins_activity: yes
          plugins_languages: yes
          plugins_languages_ignored: html, css
          plugins_languages_limit: 8
      - name: Commit file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(metrics): update profile metrics"
          file_pattern: ".github/metrics.svg README.md"
